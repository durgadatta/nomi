name: Playground CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n 0 prototype/tests/smoke prototype/tests/contracts/test_web_no_pyodide_default_contract.py

  runtime:
    name: Web runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 scripts/check_web_runtime.py

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m pip install -e '.[web-test]'
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/check_web_browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser
          path: reports/web-browser/
          if-no-files-found: warn
          retention-days: 7
