[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nomi"
version = "0.1.0"
description = "Experimental general-purpose language with inspectable prototype runtimes"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Topic :: Software Development :: Interpreters",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lark",
]

[project.optional-dependencies]
web-test = [
    "playwright>=1.51,<2",
]
jupyter = [
    "ipykernel",
    "jupyterlab",
    "jupyter_client",
    "nbformat",
    "notebook",
]
dev = [
    "setuptools",
    "ipykernel",
    "jupyterlab",
    "jupyter_client",
    "nbformat",
    "notebook",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-regressions",
    "pytest-xdist",
    "jsonschema",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["prototype*", "scripts*", "tools*"]
exclude = ["prototype.tests*", "*.node_modules*", "*.target*"]

[tool.setuptools.package-data]
"prototype.grammar" = ["*.lark", "layers/*.lark"]
"prototype.runtime" = [
    "host_capabilities.json", "js/*.js", "js/pkg/*.js",
    "js/pkg/*.wasm", "js/pkg/*.json",
]
"scripts" = ["demo.nomi"]

[project.scripts]
nomi = "scripts.cli:main"
nomi-rag = "tools.rag_mcp.cli:main"
nomi-rag-mcp = "tools.rag_mcp.mcp_server:main"

[tool.pytest.ini_options]
addopts = "-n auto"
markers = [
    "smoke: tiny checkout-alive checks intended for the first local confidence pass",
    "feature: language feature packet tests spanning parse, lowering, diagnostics, runtime, or reduced invariants",
    "contract: public runtime, parser, tooling, or adapter contract tests",
    "browser_pipeline: source -> Rust/WASM parser -> JS lowerer -> JS runtime browser pipeline contracts",
    "regression: broad output drift checks, usually snapshot-backed",
    "frontend: web, notebook, or other user-facing tooling surface checks",
    "slow: checks that are intentionally outside the fast edit loop",
    "snapshot: tests that compare or regenerate stored output snapshots",
]
