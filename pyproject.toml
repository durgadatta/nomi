[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nomi"
version = "0.1.0"
readme = "README.md"

[tool.setuptools]
py-modules = ["scripts"] 
packages = ["prototype"]

[project.scripts]
nomi = "scripts.cli:main"

[tool.pytest.ini_options]
addopts = "-n auto"
