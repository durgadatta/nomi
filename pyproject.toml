[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nomi"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "lark",
]

[project.optional-dependencies]
jupyter = [
    "ipykernel",
    "jupyterlab",
    "jupyter_client",
    "nbformat",
    "notebook",
]
dev = [
    "ipykernel",
    "jupyterlab",
    "jupyter_client",
    "nbformat",
    "notebook",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-regressions",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
include = ["prototype*", "scripts*", "tools*"]

[project.scripts]
nomi = "scripts.cli:main"
nomi-rag = "tools.rag_mcp.cli:main"
nomi-rag-mcp = "tools.rag_mcp.mcp_server:main"

[tool.pytest.ini_options]
addopts = "-n auto"
