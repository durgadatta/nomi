<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Playground</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<style>
  :root {
    --bg: #1e1e2e; --panel: #181825; --border: #313244;
    --text: #cdd6f4; --muted: #6c7086; --green: #a6e3a1;
    --blue: #89b4fa; --red: #f38ba8; --surface: #11111b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    height: 40px; min-height: 40px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--green); }
  header .status { font-size: 11px; color: var(--muted); margin-left: 4px; }
  header .sep { flex: 1; }
  header button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  header button:hover { background: var(--border); }

  main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 200px; min-width: 100px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    padding: 10px 12px; color: var(--muted);
  }
  .sidebar .file-list { flex: 1; overflow-y: auto; padding: 0 0 8px 0; }
  .sidebar .file-list div {
    padding: 5px 12px 5px 18px; font-size: 12px; cursor: pointer;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar .file-list div:hover { background: var(--surface); color: var(--text); }
  .sidebar .file-list div.active { color: var(--green); background: var(--surface); }

  #editor-container { flex: 1; min-width: 0; }

  .output-panel {
    width: 360px; min-width: 180px; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .output-panel .tabs {
    display: flex; border-bottom: 1px solid var(--border);
  }
  .output-panel .tabs div {
    flex: 1; text-align: center; padding: 8px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
  }
  .output-panel .tabs div.active { color: var(--green); border-bottom-color: var(--green); }
  .output-panel .content {
    flex: 1; padding: 12px; overflow: auto; font-size: 13px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .output-panel .content.error { color: var(--red); }
  .output-panel .bindings { border-top: 1px solid var(--border); padding: 8px 12px; font-size: 12px; }
  .output-panel .bindings span { color: var(--blue); }

  .toolbar {
    height: 36px; min-height: 36px;
    background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
  }
  .toolbar .hint { font-size: 11px; color: var(--muted); }
  .toolbar .sep2 { flex: 1; }
  .toolbar button.run {
    background: var(--green); color: var(--surface); border: none;
    padding: 5px 20px; border-radius: 4px; font-size: 13px;
    font-weight: 600; cursor: pointer; letter-spacing: 1px;
  }
  .toolbar button.run:hover { filter: brightness(1.1); }
  .toolbar button.run:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(17,17,27,0.95);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 100;
  }
  .loading-overlay p { margin-top: 16px; font-size: 14px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .resize-handle { width: 4px; cursor: col-resize; background: transparent; }
  .resize-handle:hover, .resize-handle.dragging { background: var(--blue); }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">Loading Nomi...</p>
</div>

<header>
  <h1>Nomi</h1>
  <span class="status" id="status">initializing</span>
  <span class="sep"></span>
  <button onclick="loadFile('demo')">Demo</button>
  <button onclick="loadFile('block')">Blocks</button>
  <button onclick="loadFile('constraint')">Constraints</button>
</header>

<main>
  <div class="sidebar" id="sidebar">
    <h3>Samples</h3>
    <div class="file-list" id="file-list"></div>
  </div>
  <div class="resize-handle" id="resize-l"></div>
  <div id="editor-container"></div>
  <div class="resize-handle" id="resize-r"></div>
  <div class="output-panel">
    <div class="tabs">
      <div class="active" onclick="switchTab('output')">Output</div>
      <div onclick="switchTab('vars')">Variables</div>
    </div>
    <div class="content" id="output-content"></div>
    <div class="bindings" id="bindings"></div>
  </div>
</main>

<div class="toolbar">
  <span class="hint">Ctrl+Enter to run</span>
  <span class="sep2"></span>
  <button class="run" id="run-btn" onclick="run()" disabled>Run ▸</button>
</div>

<script>
let _pyodide = null;
let _runFn = null;
let _editor = null;
let _ready = false;

function log(msg) { console.log("[web]", msg); document.getElementById("loading-msg").textContent = msg; }

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// --- File demos ---
const DEMOS = {
  demo: `func greet(name):
    return f"Hello, {name}!"

result = greet("World")
print(result)`,
  block: `func each(items):
    for item in items:
        yield item

total = 0
each([1, -2, 3, 8]) -> item:
    if item > 0:
        total += item

print(f"total = {total}")`,
  constraint: `is_positive = (x) => x > 0
score: int, is_positive = 72

match score:
    case 100:
        label = "perfect"
    case _:
        label = "regular"

print(f"score={score}, grade={label}")`
};

// --- Sidebar ---
function buildFileList() {
  const list = document.getElementById("file-list");
  for (const [name] of Object.entries(DEMOS)) {
    const el = document.createElement("div");
    el.textContent = name + ".nomi";
    el.onclick = () => { loadFile(name); };
    list.appendChild(el);
  }
}

window.loadFile = function(name) {
  if (DEMOS[name] && _editor) {
    _editor.setValue(DEMOS[name]);
    const list = document.getElementById("file-list");
    list.querySelectorAll("div").forEach(d => d.classList.remove("active"));
    list.querySelector(`div:nth-child(${Object.keys(DEMOS).indexOf(name) + 1})`).classList.add("active");
  }
};

// --- Run ---
async function run() {
  if (!_ready || !_runFn) return;
  const code = _editor.getValue();
  const out = document.getElementById("output-content");
  const bind = document.getElementById("bindings");
  const btn = document.getElementById("run-btn");
  btn.disabled = true; btn.textContent = "...";

  try {
    const result = await _runFn(code);
    const r = result.toJs();
    if (r.has("error")) {
      out.textContent = r.get("error"); out.className = "content error";
      bind.innerHTML = "";
    } else {
      out.textContent = r.get("output") || "(no output)"; out.className = "content";
      const b = r.get("bindings");
      if (b && b.size > 0) {
        let html = ""; b.forEach((v,k) => html += `<span>${k}</span> = ${esc(v)}<br>`);
        bind.innerHTML = html;
      } else { bind.innerHTML = ""; }
    }
  } catch(e) { out.textContent = String(e); out.className = "content error"; }
  btn.disabled = false; btn.textContent = "Run ▸";
}

window.run = run;

window.switchTab = function(name) {
  document.querySelectorAll(".tabs div").forEach(d => d.classList.remove("active"));
  document.querySelector(`.tabs div:${name==="output"?"first":"last"}-child`).classList.add("active");
};

// --- Resize ---
function setupResize(h, left, right, dir) {
  let d = false;
  h.addEventListener("mousedown",()=>{ d=true; h.classList.add("dragging"); document.body.style.cursor="col-resize"; document.body.style.userSelect="none"; });
  addEventListener("mousemove",(e)=>{
    if(!d) return;
    if(dir==="left") left.style.width=Math.max(80,e.clientX-left.getBoundingClientRect().left)+"px";
    else right.style.width=Math.max(80,right.getBoundingClientRect().right-e.clientX)+"px";
  });
  addEventListener("mouseup",()=>{ d=false; h.classList.remove("dragging"); document.body.style.cursor=""; document.body.style.userSelect=""; });
}

// --- Init everything ---
async function init() {
  buildFileList();

  // 1. Pyodide
  log("Loading Pyodide...");
  _pyodide = await loadPyodide();
  log("Installing lark...");
  await _pyodide.loadPackage("micropip");
  const mp = _pyodide.pyimport("micropip");
  await mp.install("lark");

  // 2. Nomi runtime
  log("Initializing Nomi...");
  const nomiPy = await fetch("./nomi_web.py").then(r => r.text());
  await _pyodide.runPythonAsync(nomiPy);
  await _pyodide.globals.get("init_nomi")();
  _runFn = _pyodide.globals.get("run_nomi");

  // 3. Monaco editor
  log("Loading editor...");
  await initMonaco();

  _ready = true;
  document.getElementById("loading").style.display = "none";
  document.getElementById("status").textContent = "ready";
  document.getElementById("run-btn").disabled = false;
  console.log("[web] Ready");
}

// --- Monaco ---
async function initMonaco() {
  return new Promise((resolve) => {
    require.config({
      paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" },
      "vs/nls": { availableLanguages: { "*": "en" } }
    });
    require(["vs/editor/editor.main"], function() {
      // Register Nomi language
      monaco.languages.register({ id: "nomi", extensions: [".nomi"], aliases: ["Nomi"] });

      // Monarch tokenizer — mirrors the TextMate grammar in tools/vscode/nomi/syntaxes/nomi.tmLanguage.json
      monaco.languages.setMonarchTokensProvider("nomi", {
        tokenizer: {
          root: [
            [/#.*$/, "comment"],
            [/f?r?"""/, { token: "string.quote", bracket: "@open", next: "@tqstring" }],
            [/f?r?'''/, { token: "string.quote", bracket: "@open", next: "@tqstring2" }],
            [/f?r?"/, { token: "string.quote", bracket: "@open", next: "@dqstring" }],
            [/f?r?'/, { token: "string.quote", bracket: "@open", next: "@sqstring" }],
            [/@[a-zA-Z_]\w*/, "tag"],
            [/\b(func|class|data|const|module|export)\b/, "keyword"],
            [/\b(if|elif|else|for|while|try|except|finally|with|as|match|case|return|yield|from|raise|break|continue|pass|in|is|not|and|or|async|await|global|nonlocal|assert|del|import)\b/, "keyword"],
            [/\b(True|False|None|Ellipsis)\b/, "keyword"],
            [/\b\d+(\.\d+)?([eE][+-]?\d+)?\b/, "number"],
            [/[+\-*/%&|^~<>!=]=?|\.\.\.|->|=>|:=/, "operator"],
            [/[{}()[\]]/, "@brackets"],
            [/[a-zA-Z_]\w*(?=\s*\()/, "type.identifier"],
            [/[a-zA-Z_]\w*/, "identifier"],
          ],
          tqstring: [
            [/"""/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/[^\\"]+/, "string"],
            [/./, "string"],
          ],
          tqstring2: [
            [/'''/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/[^\\']+/, "string"],
            [/./, "string"],
          ],
          dqstring: [
            [/"/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/\\[\\'"nrtbfv]/, "string.escape"],
            [/{/, { token: "string.interpolated", next: "@interp" }],
            [/[^\\"{]+/, "string"],
            [/./, "string"],
          ],
          sqstring: [
            [/'/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/\\[\\'"nrtbfv]/, "string.escape"],
            [/{/, { token: "string.interpolated", next: "@interp" }],
            [/[^\\'{]+/, "string"],
            [/./, "string"],
          ],
          interp: [
            [/}/, { token: "string.interpolated", next: "@pop" }],
            [/[a-zA-Z_]\w*/, "identifier"],
            [/[^}]+/, "string"],
          ],
        },
      });

      // Language configuration — mirrors tools/vscode/nomi/language-configuration.json
      monaco.languages.setLanguageConfiguration("nomi", {
        comments: { lineComment: "#" },
        brackets: [["{", "}"], ["[", "]"], ["(", ")"]],
        autoClosingPairs: [
          { open: "{", close: "}" }, { open: "[", close: "]" }, { open: "(", close: ")" },
          { open: '"', close: '"' }, { open: "'", close: "'" },
        ],
        surroundingPairs: [
          ["{", "}"], ["[", "]"], ["(", ")"], ['"', '"'], ["'", "'"],
        ],
        folding: { offSide: true },
        indentationRules: {
          increaseIndentPattern: /^.*:\s*$/,
          decreaseIndentPattern: /^\s*(elif|else|except|finally|case)\b/,
        },
      });

      // Monaco theme — Catppuccin Mocha
      monaco.editor.defineTheme("nomi-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
          { token: "comment", foreground: "6c7086", fontStyle: "italic" },
          { token: "keyword", foreground: "cba6f7" },
          { token: "string", foreground: "a6e3a1" },
          { token: "string.escape", foreground: "f9e2af" },
          { token: "string.interpolated", foreground: "f9e2af", fontStyle: "bold" },
          { token: "number", foreground: "fab387" },
          { token: "operator", foreground: "89dceb" },
          { token: "tag", foreground: "f38ba8" },
          { token: "type.identifier", foreground: "89b4fa" },
          { token: "identifier", foreground: "cdd6f4" },
          { token: "", foreground: "cdd6f4" },
        ],
        colors: {
          "editor.background": "#1e1e2e",
          "editor.foreground": "#cdd6f4",
          "editor.lineHighlightBackground": "#181825",
          "editor.selectionBackground": "#45475a",
          "editor.inactiveSelectionBackground": "#313244",
          "editorCursor.foreground": "#f5e0dc",
          "editorLineNumber.foreground": "#585b70",
          "editorLineNumber.activeForeground": "#a6adc8",
        },
      });

      _editor = monaco.editor.create(document.getElementById("editor-container"), {
        value: DEMOS["demo"],
        language: "nomi",
        theme: "nomi-dark",
        fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Fira Code', 'SF Mono', monospace",
        lineNumbers: "on",
        minimap: { enabled: false },
        bracketPairColorization: { enabled: true },
        autoIndent: "full",
        formatOnPaste: true,
        tabSize: 4,
        insertSpaces: false,
        renderWhitespace: "selection",
        scrollBeyondLastLine: false,
        folding: true,
        smoothScrolling: true,
        cursorBlinking: "smooth",
        cursorSmoothCaretAnimation: "on",
      });

      _editor.addAction({
        id: "run-nomi",
        label: "Run Nomi",
        keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter],
        run: () => run(),
      });

      resolve();
    });
  });
}

init().then(() => {
  setupResize(document.getElementById("resize-l"), document.getElementById("sidebar"), document.getElementById("editor-container"), "left");
  setupResize(document.getElementById("resize-r"), document.getElementById("editor-container"), document.querySelector(".output-panel"), "right");
});
</script>
</body>
</html>
