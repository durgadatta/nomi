<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Playground</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="loading-overlay" id="loading">
    <div class="loading-card">
      <div class="loader-row">
        <div class="spinner"></div>
        <div>
          <strong>Starting Nomi</strong>
          <p id="loading-msg">Loading runtime...</p>
        </div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="mark">N</div>
      <div class="brand-text">
        <strong>Nomi Playground</strong>
        <span>Browser notebook</span>
      </div>
    </div>
    <div class="status-pill" id="status-pill">
      <span class="status-dot"></span>
      <span id="status">initializing</span>
    </div>
    <div class="top-actions">
      <button type="button" onclick="loadFile('demo')">Demo</button>
      <button type="button" onclick="loadFile('notebook-intro')">Notebook</button>
      <button type="button" onclick="loadFile('block')">Blocks</button>
      <button type="button" onclick="loadFile('constraint')">Constraints</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="panel-heading">
        <h2>Samples</h2>
        <span id="sample-count">0</span>
      </div>
      <div class="sample-list" id="file-list"></div>
    </aside>
    <div class="resize-handle" id="resize-l"></div>
    <div class="nb-scroll" id="nb-scroll">
      <div class="nb-toolbar">
        <span class="nb-title" id="current-file">demo.nomi</span>
        <button type="button" id="reset-btn" disabled onclick="resetRuntime()">Reset</button>
        <button type="button" id="restart-btn" disabled onclick="restartWorker()">Restart Worker</button>
        <button type="button" id="cancel-btn" disabled onclick="cancelRun()">Cancel</button>
        <button type="button" class="run-button" id="run-all-btn" disabled onclick="runAllCells()">Run All</button>
        <button type="button" id="add-cell-btn" onclick="addCell()">+ Cell</button>
      </div>
      <div class="nb-cells" id="nb-cells"></div>
    </div>
  </main>

  <footer class="footer">
    <span id="cell-detail">0 cells</span>
    <span class="spacer"></span>
    <span id="runtime-detail">WASM + JS Runtime</span>
  </footer>
</div>

<script src="app.js"></script>
<script src="demos.js"></script>
<script src="cells.js"></script>
<script src="runtime.js"></script>
<script src="editor.js"></script>
<script>
init().then(() => {
  setupResize(byId("resize-l"), byId("sidebar"));
  addEventListener("resize", layoutAllEditorsSoon);
}).catch((error) => {
  console.error(error);
  byId("loading-msg").textContent = error && error.message ? error.message : String(error);
  setStatus("error", "error");
});
</script>
</body>
</html>
