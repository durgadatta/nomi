<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171a19">
<title>Nomi Playground</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app" id="app-shell">
  <div class="loading-overlay" id="loading">
    <div class="loading-card" role="status" aria-live="polite">
      <div class="loader-row">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="loading-title">Starting Nomi</strong>
          <p id="loading-msg">Loading runtime...</p>
        </div>
      </div>
      <button type="button" class="command-button" id="loading-retry-btn" hidden onclick="location.reload()">
        <i data-lucide="refresh-cw"></i><span>Retry</span>
      </button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-group">
      <button type="button" class="icon-button sidebar-toggle" id="sidebar-toggle"
              onclick="toggleSidebar()" title="Toggle sample browser" aria-label="Toggle sample browser"
              aria-controls="sidebar" aria-expanded="true">
        <i data-lucide="panel-left"></i>
      </button>
      <div class="brand" aria-label="Nomi Playground">
        <div class="mark" aria-hidden="true">N</div>
        <div class="brand-text">
          <strong>Nomi</strong>
          <span>Playground</span>
        </div>
      </div>
    </div>

    <div class="document-title" title="Current document">
      <i data-lucide="file-code-2" aria-hidden="true"></i>
      <strong id="current-file">demo_terse.nomi</strong>
      <span class="document-state" id="document-state">Sample</span>
    </div>

    <div class="topbar-actions">
      <div class="status-pill" id="status-pill" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status">initializing</span>
      </div>
      <button type="button" class="icon-button cancel-button" id="cancel-btn" disabled
              onclick="cancelRun()" title="Cancel execution" aria-label="Cancel execution">
        <i data-lucide="square"></i>
      </button>
      <button type="button" class="primary-button" id="run-all-btn" disabled onclick="runAllCells()"
              title="Run current program" aria-label="Run current program">
        <i data-lucide="play"></i>
        <span data-run-label>Run</span>
      </button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="panel-heading">
        <h2>Workspace</h2>
        <span id="sample-count">0 files</span>
      </div>
      <div class="sidebar-tools">
        <label class="search-field" for="sample-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="sample-search" type="search" placeholder="Find a sample" autocomplete="off"
                 oninput="filterSamples(this.value)">
        </label>
        <button type="button" class="new-scratch-button" onclick="newScratch()"
                title="Create local scratch file" aria-label="Create local scratch file">
          <i data-lucide="file-plus-2"></i>
          <span>New scratch</span>
        </button>
      </div>
      <nav class="sample-list" id="file-list" aria-label="Nomi samples"></nav>
    </aside>
    <button type="button" class="sidebar-scrim" id="sidebar-scrim" onclick="toggleSidebar(false)"
            aria-label="Close sample browser"></button>
    <div class="resize-handle" id="resize-l" role="separator" aria-orientation="vertical"
         aria-label="Resize sample browser" tabindex="0" aria-valuemin="210" aria-valuemax="420"></div>

    <section class="workbench" aria-label="Nomi workbench">
      <div class="nb-toolbar">
        <div class="document-meta">
          <span class="mode-badge" id="document-kind">Program</span>
          <span id="document-lines">0 lines</span>
        </div>
        <div class="toolbar-actions">
          <input id="open-file-input" type="file" accept=".nomi,.nb,.txt" hidden onchange="openLocalSource(this)">
          <button type="button" class="icon-button" onclick="byId('open-file-input').click()"
                  title="Open local source" aria-label="Open local source"><i data-lucide="folder-open"></i></button>
          <button type="button" class="icon-button" onclick="downloadCurrentSource()"
                  title="Download source" aria-label="Download source"><i data-lucide="download"></i></button>
          <button type="button" class="icon-button" id="copy-code-btn" onclick="copyCurrentCode()"
                  title="Copy source" aria-label="Copy source">
            <i data-lucide="copy"></i>
          </button>
          <button type="button" class="icon-button" id="revert-btn" onclick="revertCurrentDocument()"
                  title="Revert local changes" aria-label="Revert local changes" disabled>
            <i data-lucide="rotate-ccw"></i>
          </button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button type="button" class="icon-button" id="reset-btn" disabled onclick="resetRuntime()"
                  title="Reset runtime state" aria-label="Reset runtime state">
            <i data-lucide="eraser"></i>
          </button>
          <button type="button" class="icon-button" id="restart-btn" disabled onclick="restartWorker()"
                  title="Restart runtime worker" aria-label="Restart runtime worker">
            <i data-lucide="refresh-cw"></i>
          </button>
          <button type="button" class="command-button" id="add-cell-btn" onclick="addCell()">
            <i data-lucide="plus"></i>
            <span>Cell</span>
          </button>
        </div>
      </div>
      <div class="nb-scroll" id="nb-scroll">
        <div class="nb-cells" id="nb-cells"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span class="runtime-profile" id="runtime-profile"><i data-lucide="cpu" aria-hidden="true"></i>Prototype · WASM + JS</span>
    <span class="footer-separator" aria-hidden="true"></span>
    <span id="runtime-detail">Starting runtime</span>
    <span class="spacer"></span>
    <span id="cursor-detail">Ln 1, Col 1</span>
    <span class="footer-separator" aria-hidden="true"></span>
    <span id="cell-detail">0 cells</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="documents.js?v=5"></script>
<script src="app.js?v=7"></script>
<script src="demos.js?v=6"></script>
<script src="cells.js?v=5"></script>
<script src="runtime.js?v=7"></script>
<script src="editor.js?v=6"></script>
<script>
init().then(() => {
  setupResize(byId("resize-l"), byId("sidebar"));
  addEventListener("resize", handleViewportChange);
}).catch(failStartup);
</script>
</body>
</html>
