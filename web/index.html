<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Playground</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<style>
  :root {
    --bg: #1e1e2e; --panel: #181825; --border: #313244;
    --text: #cdd6f4; --muted: #6c7086; --green: #a6e3a1;
    --blue: #89b4fa; --red: #f38ba8; --yellow: #f9e2af;
    --surface: #11111b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    height: 40px; min-height: 40px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--green); }
  header .status { font-size: 11px; color: var(--muted); margin-left: 4px; }
  header .sep { flex: 1; }
  header button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  header button:hover { background: var(--border); }

  main { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 200px; min-width: 140px; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    padding: 10px 12px; color: var(--muted);
  }
  .sidebar .file-list {
    flex: 1; overflow-y: auto; padding: 0 0 8px 0;
  }
  .sidebar .file-list div {
    padding: 5px 12px 5px 18px; font-size: 12px; cursor: pointer;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar .file-list div:hover { background: var(--surface); color: var(--text); }
  .sidebar .file-list div.active { color: var(--green); background: var(--surface); }

  .editor-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .cm-editor { height: 100%; font-size: 14px; }
  .cm-editor .cm-scroller { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; }
  .cm-editor.cm-focused { outline: none; }

  .output-panel {
    width: 360px; min-width: 200px; background: var(--surface);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .output-panel .tabs {
    display: flex; border-bottom: 1px solid var(--border);
  }
  .output-panel .tabs div {
    flex: 1; text-align: center; padding: 8px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent;
  }
  .output-panel .tabs div.active { color: var(--green); border-bottom-color: var(--green); }
  .output-panel .content {
    flex: 1; padding: 12px; overflow: auto; font-size: 13px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  .output-panel .content.error { color: var(--red); }
  .output-panel .bindings { border-top: 1px solid var(--border); padding: 8px 12px; font-size: 12px; }
  .output-panel .bindings span { color: var(--blue); }

  .toolbar {
    height: 36px; min-height: 36px;
    background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
  }
  .toolbar .hint { font-size: 11px; color: var(--muted); }
  .toolbar .sep2 { flex: 1; }
  .toolbar button.run {
    background: var(--green); color: var(--surface); border: none;
    padding: 5px 20px; border-radius: 4px; font-size: 13px;
    font-weight: 600; cursor: pointer; letter-spacing: 1px;
  }
  .toolbar button.run:hover { filter: brightness(1.1); }
  .toolbar button.run:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(17,17,27,0.95);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 100;
  }
  .loading-overlay p { margin-top: 16px; font-size: 14px; color: var(--muted); }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .resize-handle { width: 4px; cursor: col-resize; background: transparent; }
  .resize-handle:hover, .resize-handle.dragging { background: var(--blue); }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">Loading Nomi...</p>
</div>

<header>
  <h1>Nomi</h1>
  <span class="status" id="status">initializing</span>
  <span class="sep"></span>
  <button onclick="loadFile('demo')">Demo</button>
  <button onclick="loadFile('block')">Blocks</button>
  <button onclick="loadFile('constraint')">Constraints</button>
</header>

<main>
  <div class="sidebar" id="sidebar">
    <h3>Examples</h3>
    <div class="file-list" id="file-list"></div>
  </div>
  <div class="resize-handle" id="resize-handle"></div>
  <div class="editor-panel" id="editor-container"></div>
  <div class="resize-handle" id="resize-handle-r"></div>
  <div class="output-panel">
    <div class="tabs">
      <div class="active" onclick="switchTab('output')">Output</div>
      <div onclick="switchTab('vars')">Variables</div>
    </div>
    <div class="content" id="output-content"></div>
    <div class="bindings" id="bindings"></div>
  </div>
</main>

<div class="toolbar">
  <span class="hint">Ctrl+Enter to run</span>
  <span class="sep2"></span>
  <button class="run" id="run-btn" onclick="run()" disabled>Run ▸</button>
</div>

<script type="module">
import { EditorView, keymap, lineNumbers, highlightActiveLine, highlightActiveLineGutter } from "https://esm.sh/@codemirror/view@6";
import { EditorState } from "https://esm.sh/@codemirror/state@6";
import { defaultKeymap, history, historyKeymap, indentWithTab } from "https://esm.sh/@codemirror/commands@6";
import { python } from "https://esm.sh/@codemirror/lang-python@6";
import { oneDark } from "https://esm.sh/@codemirror/theme-one-dark@6";
import { bracketMatching } from "https://esm.sh/@codemirror/language@6";
import { closeBrackets } from "https://esm.sh/@codemirror/autocomplete@6";

let ready = false;
let _runFn = null;
let editorView = null;

function log(msg) {
  console.log("[web]", msg);
  document.getElementById("loading-msg").textContent = msg;
}

async function init() {
  try {
    log("Loading Pyodide...");
    const pyodide = await loadPyodide();

    log("Installing lark...");
    await pyodide.loadPackage("micropip");
    const mp = pyodide.pyimport("micropip");
    await mp.install("lark");

    log("Initializing Nomi...");
    const nomiPy = await fetch("./nomi_web.py").then(r => r.text());
    await pyodide.runPythonAsync(nomiPy);
    const initFn = pyodide.globals.get("init_nomi");
    await initFn();

    _runFn = pyodide.globals.get("run_nomi");
    window.pyodide = pyodide;

    ready = true;
    document.getElementById("loading").style.display = "none";
    document.getElementById("status").textContent = "ready";
    document.getElementById("run-btn").disabled = false;
    console.log("[web] Ready");
  } catch (e) {
    log("Error: " + e.message);
    console.error(e);
  }
}

// --- CodeMirror setup ---
function setupEditor() {
  const ext = [
    python(),
    oneDark,
    lineNumbers(),
    highlightActiveLine(),
    highlightActiveLineGutter(),
    bracketMatching(),
    closeBrackets(),
    history(),
    keymap.of([
      ...defaultKeymap,
      ...historyKeymap,
      indentWithTab,
      { key: "Ctrl-Enter", run: () => { run(); return true; } },
      { key: "Cmd-Enter", run: () => { run(); return true; } },
    ]),
    EditorView.updateListener.of(update => {
      if (update.docChanged) {
        setPending(true);
      }
    }),
  ];

  const state = EditorState.create({
    doc: DEMOS["demo"],
    extensions: ext,
  });

  editorView = new EditorView({
    state,
    parent: document.getElementById("editor-container"),
  });
}

// --- File loading ---
let pendingChanges = false;
function setPending(v) { pendingChanges = v; }

const DEMOS = {
  demo: `func greet(name):
    return f"Hello, {name}!"

result = greet("World")
print(result)`,
  block: `func each(items):
    for item in items:
        yield item

total = 0
each([1, -2, 3, 8]) -> item:
    if item > 0:
        total += item

print(f"total = {total}")`,
  constraint: `is_positive = (x) => x > 0
score: int, is_positive = 72

match score:
    case 100:
        label = "perfect"
    case _:
        label = "regular"

print(f"score={score}, grade={label}")`
};

window.loadFile = function(name) {
  if (DEMOS[name]) {
    editorView.dispatch({
      changes: { from: 0, to: editorView.state.doc.length, insert: DEMOS[name] }
    });
    setPending(true);
  }
};

function buildFileList() {
  const list = document.getElementById("file-list");
  for (const [name] of Object.entries(DEMOS)) {
    const el = document.createElement("div");
    el.textContent = name + ".nomi";
    el.onclick = () => {
      loadFile(name);
      list.querySelectorAll("div").forEach(d => d.classList.remove("active"));
      el.classList.add("active");
    };
    list.appendChild(el);
  }
  list.firstElementChild?.classList.add("active");
}

// --- Run ---
async function run() {
  if (!ready || !_runFn) return;
  const code = editorView.state.doc.toString();
  const out = document.getElementById("output-content");
  const bind = document.getElementById("bindings");
  const btn = document.getElementById("run-btn");
  btn.disabled = true; btn.textContent = "...";
  setPending(false);

  try {
    const result = await _runFn(code);
    const r = result.toJs();
    if (r.has("error")) {
      out.textContent = r.get("error");
      out.className = "content error";
      bind.innerHTML = "";
    } else {
      out.textContent = r.get("output") || "(no output)";
      out.className = "content";
      const bindings = r.get("bindings");
      if (bindings && bindings.size > 0) {
        let html = "";
        bindings.forEach((v, k) => html += `<span>${k}</span> = ${esc(v)}<br>`);
        bind.innerHTML = html;
      } else {
        bind.innerHTML = "";
      }
    }
  } catch (e) {
    out.textContent = String(e);
    out.className = "content error";
  }
  btn.disabled = false; btn.textContent = "Run ▸";
}

window.run = run;

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// --- Output tabs ---
let activeTab = "output";
window.switchTab = function(name) {
  activeTab = name;
  document.querySelectorAll(".tabs div").forEach(d => d.classList.remove("active"));
  document.querySelector(`.tabs div:${name === "output" ? "first" : "last"}-child`).classList.add("active");
};

// --- Resize handles ---
function setupResize(handle, leftPane, rightPane, direction) {
  let dragging = false;
  handle.addEventListener("mousedown", () => {
    dragging = true;
    handle.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    if (direction === "left") {
      leftPane.style.width = Math.max(100, e.clientX - leftPane.getBoundingClientRect().left) + "px";
    } else {
      const rect = rightPane.getBoundingClientRect();
      rightPane.style.width = Math.max(100, rect.right - e.clientX) + "px";
    }
  });
  document.addEventListener("mouseup", () => {
    dragging = false;
    handle.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  });
}

// --- Init ---
buildFileList();
setupEditor();
init();

setupResize(
  document.getElementById("resize-handle"),
  document.getElementById("sidebar"),
  document.getElementById("editor-container"),
  "left"
);
setupResize(
  document.getElementById("resize-handle-r"),
  document.getElementById("editor-container"),
  document.querySelector(".output-panel"),
  "right"
);
</script>
</body>
</html>
