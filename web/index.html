<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomi Playground</title>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
<style>
  :root {
    --bg: #151716;
    --panel: #1f2321;
    --panel-2: #242a27;
    --panel-3: #2d3530;
    --surface: #101211;
    --line: #3c443f;
    --line-soft: #2c332f;
    --text: #eef3ef;
    --muted: #a9b3ad;
    --dim: #747f78;
    --green: #a7d67a;
    --teal: #77d0c2;
    --amber: #e8c16f;
    --red: #ef8f8f;
    --blue: #9bbdf2;
    --shadow: 0 18px 40px rgba(0,0,0,0.28);
    --sidebar-width: 248px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--text); background: var(--bg);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, textarea, input { font: inherit; }
  button {
    min-height: 32px; border: 1px solid var(--line); border-radius: 7px;
    color: var(--text); background: var(--panel-2); cursor: pointer;
  }
  button:hover { background: var(--panel-3); border-color: #56625a; }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; color: var(--dim); background: var(--panel); }

  .app { height: 100%; display: grid; grid-template-rows: 52px minmax(0,1fr) 34px; background: var(--bg); }
  .topbar {
    display: grid; grid-template-columns: minmax(180px,auto) 1fr auto;
    align-items: center; gap: 16px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    width: 28px; height: 28px; display: grid; place-items: center;
    border-radius: 7px; color: #172013; background: var(--green);
    font-size: 15px; font-weight: 800;
  }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand strong { font-size: 14px; line-height: 17px; font-weight: 700; }
  .brand span { color: var(--muted); font-size: 11px; line-height: 14px; }
  .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .top-actions button { padding: 0 11px; font-size: 12px; }
  .status-pill {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px;
    min-width: 126px; height: 28px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 12px;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .status-pill.ready .status-dot { background: var(--green); }
  .status-pill.running .status-dot { background: var(--teal); }
  .status-pill.error .status-dot { background: var(--red); }

  .workspace {
    min-height: 0; display: grid;
    grid-template-columns: var(--sidebar-width) 4px minmax(320px, 1fr);
    background: var(--surface);
  }
  .sidebar {
    min-width: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: grid; grid-template-rows: auto minmax(0, 1fr);
  }
  .panel-heading {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 44px; padding: 0 14px; border-bottom: 1px solid var(--line-soft);
  }
  .panel-heading h2 { margin: 0; font-size: 12px; font-weight: 700; }
  .panel-heading span { color: var(--dim); font-size: 11px; }
  .sample-list { min-height: 0; overflow: auto; padding: 10px; }
  .sample {
    width: 100%; min-height: 64px; display: grid;
    grid-template-columns: 1fr auto; grid-template-rows: auto auto;
    column-gap: 10px; row-gap: 3px; align-items: center;
    padding: 10px; margin: 0 0 8px; border: 1px solid transparent;
    border-radius: 8px; color: var(--muted); background: transparent; text-align: left;
  }
  .sample:hover { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .sample.active { color: var(--text); background: #263128; border-color: #587149; }
  .sample-name { overflow: hidden; color: inherit; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .sample-meta { color: var(--dim); font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  .sample-desc { grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 16px; }

  .resize-handle { background: transparent; cursor: col-resize; }
  .resize-handle:hover, .resize-handle.dragging { background: var(--teal); }

  .nb-scroll {
    min-width: 0; min-height: 0; overflow: auto;
    background: var(--surface); padding: 0;
  }
  .nb-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; z-index: 10;
  }
  .nb-toolbar .nb-title { font-weight: 700; font-size: 12px; margin-right: auto; }
  .nb-toolbar button { padding: 0 10px; font-size: 12px; }
  .run-button {
    min-width: 72px; color: #13200f; border-color: transparent;
    background: var(--green); font-weight: 800;
  }
  .run-button:hover { background: #b9e28d; }

  .nb-cells { padding: 14px 14px 40px; }
  .nb-cell {
    margin-bottom: 16px; border: 1px solid var(--line-soft);
    border-radius: 8px; overflow: hidden; background: #1a1e1b;
  }
  .nb-cell.active { border-color: #587149; }
  .nb-cell-header {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px; padding: 4px 10px;
    background: #1f2421; border-bottom: 1px solid var(--line-soft);
  }
  .nb-cell-index {
    display: grid; place-items: center; min-width: 32px; height: 22px;
    border-radius: 4px; color: var(--teal); background: #1a2926;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; font-weight: 700;
  }
  .nb-cell-run {
    min-height: 26px; padding: 0 8px; font-size: 11px;
    display: flex; align-items: center; gap: 4px;
  }
  .nb-cell-run.running { opacity: 0.6; }
  .nb-cell-spacer { flex: 1; }
  .nb-cell-time { color: var(--dim); font-size: 11px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  .nb-cell-delete {
    min-height: 26px; padding: 0 8px; font-size: 11px;
    color: var(--dim); border-color: transparent; background: transparent;
  }
  .nb-cell-delete:hover { color: var(--red); }

  .nb-cell-editor { min-height: 60px; }
  .nb-cell-output {
    display: none; border-top: 2px solid var(--line-soft);
    padding: 12px 14px; background: #151816;
  }
  .nb-cell-output.show { display: block; }
  .nb-cell-output .out-label {
    display: inline-block; margin-bottom: 6px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; font-weight: 700; color: var(--amber);
  }
  .nb-cell-output.error .out-label { color: var(--red); }
  .nb-cell-output pre {
    margin: 0; color: var(--text);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .nb-cell-output.error pre { color: var(--red); }

  .nb-add-btn {
    display: block; width: 100%; min-height: 40px;
    border: 1px dashed var(--line); border-radius: 8px;
    color: var(--muted); background: transparent; font-size: 13px;
  }
  .nb-add-btn:hover { border-color: var(--teal); color: var(--teal); }

  .footer {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 0 14px; color: var(--dim); background: var(--panel);
    border-top: 1px solid var(--line); font-size: 12px;
  }
  .footer .spacer { flex: 1; }

  .loading-overlay {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: rgba(16,18,17,0.96);
  }
  .loading-card {
    width: min(360px, calc(100vw - 32px)); padding: 22px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); box-shadow: var(--shadow);
  }
  .loader-row { display: flex; align-items: center; gap: 12px; }
  .spinner {
    width: 30px; height: 30px; flex: 0 0 auto;
    border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.75s linear infinite;
  }
  .loading-card strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .loading-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 920px) {
    body { overflow: auto; }
    .app { min-height: 100%; height: auto; grid-template-rows: auto auto auto; }
    .topbar { grid-template-columns: 1fr; align-items: stretch; gap: 10px; padding: 12px; }
    .status-pill { justify-self: stretch; }
    .top-actions { justify-content: stretch; }
    .top-actions button { flex: 1; }
    .workspace { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .sample-list { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 10px; }
    .sample { margin: 0; }
    .resize-handle { display: none; }
  }
  @media (max-width: 620px) {
    .sample-list { grid-template-columns: 1fr; }
    .nb-toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="loading-overlay" id="loading">
    <div class="loading-card">
      <div class="loader-row">
        <div class="spinner"></div>
        <div>
          <strong>Starting Nomi</strong>
          <p id="loading-msg">Loading runtime...</p>
        </div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="mark">N</div>
      <div class="brand-text">
        <strong>Nomi Playground</strong>
        <span>Browser notebook</span>
      </div>
    </div>
    <div class="status-pill" id="status-pill">
      <span class="status-dot"></span>
      <span id="status">initializing</span>
    </div>
    <div class="top-actions">
      <button type="button" onclick="loadFile('demo')">Demo</button>
      <button type="button" onclick="loadFile('notebook-intro')">Notebook</button>
      <button type="button" onclick="loadFile('block')">Blocks</button>
      <button type="button" onclick="loadFile('constraint')">Constraints</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="panel-heading">
        <h2>Samples</h2>
        <span id="sample-count">0</span>
      </div>
      <div class="sample-list" id="file-list"></div>
    </aside>
    <div class="resize-handle" id="resize-l"></div>
    <div class="nb-scroll" id="nb-scroll">
      <div class="nb-toolbar">
        <span class="nb-title" id="current-file">demo.nomi</span>
        <button type="button" id="restart-btn" disabled>Restart</button>
        <button type="button" class="run-button" id="run-all-btn" disabled>Run All</button>
        <button type="button" onclick="addCell()">+ Cell</button>
      </div>
      <div class="nb-cells" id="nb-cells"></div>
    </div>
  </main>

  <footer class="footer">
    <span id="cell-detail">0 cells</span>
    <span class="spacer"></span>
    <span id="runtime-detail">Pyodide</span>
  </footer>
</div>

<script>
let _pyodide = null;
let _runFn = null;
let _resetFn = null;
let _ready = false;
let _currentSample = "demo";
let _cellEditors = [];
let _executionCounter = 0;
let _activeCellIndex = 0;

function byId(id) { return document.getElementById(id); }
function log(msg) { console.log("[web]", msg); byId("loading-msg").textContent = msg; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function setStatus(text, mode) {
  byId("status").textContent = text;
  const pill = byId("status-pill");
  pill.classList.remove("ready","running","error");
  if (mode) pill.classList.add(mode);
}

function lineCount(text) { return text ? text.split(/\r\n|\r|\n/).length : 0; }

function setControlsDisabled(disabled) {
  ["restart-btn","run-all-btn"].forEach(id => byId(id).disabled = disabled || !_ready);
}

// --- DEMOS ---
const DEMOS = {
  demo: {
    title: "demo.nomi", desc: "Guided tour from samples/demo.nomi.",
    source: "samples/demo.nomi",
    code: `func greet(name):
    return f"Hello, {name}!"

result = greet("World")
print(result)`
  },
  "notebook-intro": {
    title: "notebook_intro.nomi", desc: "Notebook cells example.",
    source: "samples/notebook_intro.nomi",
    code: `# %% Define a reusable function
func normalize_name(name):
    return name.strip().title()

print(normalize_name(" ada lovelace "))

# %% Bind data that later cells can reuse
names = [" ada ", "grace", " alan turing "]
clean_names = []

for name in names:
    clean_names.append(normalize_name(name))

print(clean_names)`
  },
  terse: {
    title: "demo_terse.nomi", desc: "Compact syntax tour from samples/demo_terse.nomi.",
    source: "samples/demo_terse.nomi",
    code: `func greet(name): return "Hello, " + name
print(greet("Nomi"))`
  },
  collections: {
    title: "collections.nomi", desc: "Collection examples from samples/collections.nomi.",
    source: "samples/collections.nomi",
    code: `inclusive = list(1..5)
print("1..5 = " + str(inclusive))`
  },
  block: {
    title: "blocks.nomi", desc: "Yield-to-block control with a running total.",
    code: `func each(items):
    for item in items:
        yield item

total = 0
each([1, -2, 3, 8]) -> item:
    if item > 0:
        total += item

print(f"total = {total}")`
  },
  constraint: {
    title: "constraints.nomi", desc: "Binding constraints and a match statement.",
    code: `is_positive = (x) => x > 0
score: int, is_positive = 72

match score:
    case 100:
        label = "perfect"
    case _:
        label = "regular"

print(f"score={score}, grade={label}")`
  }
};
const SAMPLE_DESCRIPTIONS = {
  "samples/demo.nomi": "Guided tour from samples/demo.nomi.",
  "samples/demo_terse.nomi": "Compact syntax tour from samples/demo_terse.nomi.",
  "samples/collections.nomi": "Collection examples from samples/collections.nomi.",
  "samples/notebook_intro.nomi": "Notebook cells example."
};

function sampleKey(path) {
  return path.replace(/^samples\//,"").replace(/\.nomi$/,"").replace(/_/g,"-");
}

async function loadSampleSources() {
  try {
    const resp = await fetch("./manifest.json");
    if (!resp.ok) return;
    const manifest = await resp.json();
    for (const path of (manifest.samples || [])) {
      const key = path === "samples/demo.nomi" ? "demo" : path === "samples/demo_terse.nomi" ? "terse" : sampleKey(path);
      const sampleUrl = new URL(`../${path}`, location.href);
      const r = await fetch(sampleUrl);
      if (!r.ok) continue;
      const code = await r.text();
      const existing = DEMOS[key] || {};
      DEMOS[key] = { title: path.split("/").pop(), desc: SAMPLE_DESCRIPTIONS[path] || `Sample from ${path}.`, source: path, code, ...existing, code };
    }
  } catch (e) { console.warn("[web] Could not load samples from manifest", e); }
}

// --- Sidebar ---
function buildFileList() {
  const list = byId("file-list");
  list.innerHTML = "";
  const entries = Object.entries(DEMOS);
  byId("sample-count").textContent = `${entries.length} files`;
  for (const [name, demo] of entries) {
    const el = document.createElement("button");
    el.type = "button"; el.className = "sample"; el.dataset.sample = name;
    el.onclick = () => loadFile(name);
    el.innerHTML = `<span class="sample-name">${esc(demo.title)}</span><span class="sample-meta">${lineCount(demo.code)} lines</span><span class="sample-desc">${esc(demo.desc)}</span>`;
    list.appendChild(el);
  }
}

window.loadFile = function(name) {
  if (!DEMOS[name]) return;
  _currentSample = name;
  byId("current-file").textContent = DEMOS[name].title;
  document.querySelectorAll(".sample").forEach(el => el.classList.toggle("active", el.dataset.sample === name));
  loadCode(DEMOS[name].code);
};

// --- Cell management ---
function markerMatch(line) { return line.match(/^\s*#\s*%%\s*(.*)$/); }

function splitCode(code) {
  const lines = code.split(/\r\n|\r|\n/);
  const markers = [];
  lines.forEach((line, i) => { const m = markerMatch(line); if (m) markers.push({ line: i+1, title: m[1].trim() }); });
  if (markers.length === 0) return [code.trim() || "# empty cell"];
  return markers.map((mk, i) => {
    const start = mk.line + 1;
    const end = (markers[i+1] ? markers[i+1].line - 1 : lines.length);
    return lines.slice(start - 1, end).join("\n").trim() || "# empty cell";
  });
}

function loadCode(code) {
  disposeAllCells();
  const chunks = splitCode(code);
  chunks.forEach(c => createCell(c));
  _executionCounter = 0;
  updateFooter();
}

function addCell(initialCode) {
  createCell(initialCode || "");
  scrollToBottom();
}

function createCell(code) {
  const cells = byId("nb-cells");
  const idx = _cellEditors.length;
  const outer = document.createElement("div");
  outer.className = "nb-cell";
  outer.dataset.index = idx;
  outer.innerHTML = `
    <div class="nb-cell-header">
      <span class="nb-cell-index">[${idx+1}]</span>
      <button class="nb-cell-run" data-idx="${idx}" title="Run (Ctrl+Enter)">&#9654; Run</button>
      <span class="nb-cell-spacer"></span>
      <span class="nb-cell-time"></span>
      <button class="nb-cell-delete" data-idx="${idx}" title="Delete">&times;</button>
    </div>
    <div class="nb-cell-editor" data-idx="${idx}"></div>
    <div class="nb-cell-output" data-idx="${idx}">
      <div class="out-label">Out[<span class="out-num">?</span>]:</div>
      <pre></pre>
    </div>`;
  cells.appendChild(outer);

  outer.addEventListener("click", () => setActiveCell(idx));

  outer.querySelector(".nb-cell-run").addEventListener("click", (e) => {
    e.stopPropagation();
    runCell(idx, false);
  });

  outer.querySelector(".nb-cell-delete").addEventListener("click", (e) => {
    e.stopPropagation();
    deleteCell(idx);
  });

  createEditor(idx, code);
  updateFooter();

  if (_cellEditors.length === 1) setActiveCell(0);
  return idx;
}

function createEditor(idx, code) {
  const el = document.querySelector(`.nb-cell-editor[data-idx="${idx}"]`);
  if (!el || typeof monaco === "undefined") return;

  const editor = monaco.editor.create(el, {
    value: code,
    language: "nomi",
    theme: "nomi-dark",
    fontSize: 14,
    fontFamily: "'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace",
    lineHeight: 22,
    lineNumbers: "on",
    glyphMargin: false,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    folding: true,
    automaticLayout: true,
    overviewRulerBorder: false,
    renderLineHighlight: "line",
    wordWrap: "on",
    scrollbar: { vertical: "hidden", horizontal: "auto" },
    padding: { top: 8, bottom: 8 },
  });

  editor.onDidContentSizeChange((e) => {
    const h = Math.max(60, e.contentHeight);
    el.style.height = h + "px";
    editor.layout();
  });

  editor.onDidFocusEditorText(() => setActiveCell(idx));

  editor.addAction({
    id: `run-cell-${idx}`,
    label: "Run Cell",
    keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter],
    run: () => runCell(idx, false),
  });
  editor.addAction({
    id: `run-cell-advance-${idx}`,
    label: "Run Cell and Advance",
    keybindings: [monaco.KeyMod.Shift | monaco.KeyCode.Enter],
    run: () => runCell(idx, true),
  });

  _cellEditors[idx] = editor;
}

function disposeAllCells() {
  _cellEditors.forEach(e => e && e.dispose());
  _cellEditors = [];
  byId("nb-cells").innerHTML = "";
}

function deleteCell(idx) {
  if (_cellEditors.length <= 1) return;
  const editors = _cellEditors[idx];
  if (editors) editors.dispose();
  _cellEditors.splice(idx, 1);
  const el = document.querySelector(`.nb-cell[data-index="${idx}"]`);
  if (el) el.remove();
  reindexCells();
  updateFooter();
}

function reindexCells() {
  document.querySelectorAll(".nb-cell").forEach((el, i) => {
    el.dataset.index = i;
    el.querySelector(".nb-cell-index").textContent = `[${i+1}]`;
    el.querySelector(".nb-cell-run").dataset.idx = i;
    el.querySelector(".nb-cell-delete").dataset.idx = i;
    el.querySelector(".nb-cell-editor").dataset.idx = i;
    el.querySelector(".nb-cell-output").dataset.idx = i;
  });
}

function setActiveCell(idx) {
  _activeCellIndex = idx;
  document.querySelectorAll(".nb-cell").forEach(el => el.classList.remove("active"));
  const el = document.querySelector(`.nb-cell[data-index="${idx}"]`);
  if (el) {
    el.classList.add("active");
    const editor = _cellEditors[idx];
    if (editor) editor.focus();
  }
}

function updateFooter() {
  const n = _cellEditors.length;
  byId("cell-detail").textContent = `${n} cell${n!==1?"s":""}`;
}

function scrollToBottom() {
  const s = byId("nb-scroll");
  s.scrollTop = s.scrollHeight;
}

// --- Run ---
async function runCell(idx, advance) {
  if (!_ready || !_runFn) return;
  const editor = _cellEditors[idx];
  if (!editor) return;
  const code = editor.getValue().trim();
  if (!code) return;

  setControlsDisabled(true);
  setStatus("running", "running");

  const outer = document.querySelector(`.nb-cell[data-index="${idx}"]`);
  const runBtn = outer.querySelector(".nb-cell-run");
  const timeEl = outer.querySelector(".nb-cell-time");
  const outDiv = outer.querySelector(".nb-cell-output");
  const outNum = outDiv.querySelector(".out-num");
  const outPre = outDiv.querySelector("pre");
  runBtn.classList.add("running");
  runBtn.textContent = "...";

  const start = performance.now();
  try {
    const result = await _runFn(code);
    const r = result.toJs();
    const elapsed = Math.max(1, Math.round(performance.now() - start));
    const error = r.has("error") ? r.get("error") : "";
    const output = error || r.get("output") || "(no output)";

    _executionCounter++;
    timeEl.textContent = `${elapsed} ms`;
    outNum.textContent = _executionCounter;
    outPre.textContent = output;
    outDiv.className = error ? "nb-cell-output error show" : "nb-cell-output show";

    if (r.has("session")) {
      byId("runtime-detail").textContent = "Pyodide · session " + r.get("session");
    }
  } catch (e) {
    const elapsed = Math.max(1, Math.round(performance.now() - start));
    _executionCounter++;
    timeEl.textContent = `${elapsed} ms`;
    outNum.textContent = _executionCounter;
    outPre.textContent = String(e);
    outDiv.className = "nb-cell-output error show";
  }

  runBtn.classList.remove("running");
  runBtn.innerHTML = "&#9654; Run";
  setControlsDisabled(false);
  setStatus("ready", "ready");

  if (advance) {
    const nextIdx = idx + 1;
    if (nextIdx < _cellEditors.length) {
      setActiveCell(nextIdx);
      document.querySelector(`.nb-cell[data-index="${nextIdx}"]`).scrollIntoView({ behavior: "smooth", block: "center" });
    } else {
      addCell("");
      setActiveCell(_cellEditors.length - 1);
      scrollToBottom();
    }
  }
}

async function runAllCells() {
  if (!_ready || !_runFn || !_resetFn) return;
  setControlsDisabled(true);
  setStatus("running", "running");
  _executionCounter = 0;
  await _resetFn();

  for (let i = 0; i < _cellEditors.length; i++) {
    await runCell(i, false);
    const outDiv = document.querySelector(`.nb-cell-output[data-idx="${i}"]`);
    if (outDiv && outDiv.classList.contains("error")) {
      setStatus("error", "error");
      gotoCell(i);
      return;
    }
  }
  setStatus("ready", "ready");
  setControlsDisabled(false);
}

function gotoCell(idx) {
  const el = document.querySelector(`.nb-cell[data-index="${idx}"]`);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

window.restartRuntime = async function() {
  if (!_ready || !_resetFn) return;
  await _resetFn();
  _executionCounter = 0;
  document.querySelectorAll(".nb-cell-output").forEach(d => d.className = "nb-cell-output");
  document.querySelectorAll(".nb-cell-time").forEach(d => d.textContent = "");
  byId("runtime-detail").textContent = "Pyodide · restarted";
  setStatus("ready", "ready");
};

// --- Resize ---
function setupResize(handle, left) {
  let dragging = false;
  handle.addEventListener("mousedown", () => {
    dragging = true; handle.classList.add("dragging");
    document.body.style.cursor = "col-resize"; document.body.style.userSelect = "none";
  });
  addEventListener("mousemove", (e) => {
    if (!dragging) return;
    document.documentElement.style.setProperty("--sidebar-width", `${Math.max(180, Math.min(420, e.clientX - left.getBoundingClientRect().left))}px`);
    _cellEditors.forEach(ed => ed && ed.layout());
  });
  addEventListener("mouseup", () => {
    dragging = false; handle.classList.remove("dragging");
    document.body.style.cursor = ""; document.body.style.userSelect = "";
  });
}

// --- Init ---
async function init() {
  await loadSampleSources();
  buildFileList();

  log("Loading Pyodide...");
  _pyodide = await loadPyodide();
  log("Installing lark...");
  await _pyodide.loadPackage("micropip");
  const mp = _pyodide.pyimport("micropip");
  await mp.install("lark");

  log("Initializing Nomi...");
  const nomiPy = await fetch("./nomi_web.py").then(r => r.text());
  await _pyodide.runPythonAsync(nomiPy);
  await _pyodide.globals.get("init_nomi")();
  _runFn = _pyodide.globals.get("run_nomi");
  _resetFn = _pyodide.globals.get("reset_session");

  log("Loading editor...");
  await initMonaco();

  _ready = true;
  byId("loading").style.display = "none";
  setStatus("ready", "ready");
  byId("runtime-detail").textContent = "Pyodide runtime ready";
  setControlsDisabled(false);

  loadFile("demo");
  console.log("[web] Ready");
}

async function initMonaco() {
  return new Promise((resolve) => {
    require.config({
      paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" },
      "vs/nls": { availableLanguages: { "*": "en" } }
    });
    require(["vs/editor/editor.main"], function() {
      monaco.languages.register({ id: "nomi", extensions: [".nomi"], aliases: ["Nomi"] });
      monaco.languages.setMonarchTokensProvider("nomi", {
        tokenizer: {
          root: [
            [/#.*$/, "comment"],
            [/f?r?"""/, { token: "string.quote", bracket: "@open", next: "@tqstring" }],
            [/f?r?'''/, { token: "string.quote", bracket: "@open", next: "@tqstring2" }],
            [/f?r?"/, { token: "string.quote", bracket: "@open", next: "@dqstring" }],
            [/f?r?'/, { token: "string.quote", bracket: "@open", next: "@sqstring" }],
            [/@[a-zA-Z_]\w*/, "tag"],
            [/\b(func|class|data|const|module|export|type|guard|unless)\b/, "keyword"],
            [/\b(if|elif|else|for|while|try|except|finally|with|as|match|case|return|yield|from|raise|break|continue|pass|in|is|not|and|or|async|await|global|nonlocal|assert|del|import)\b/, "keyword"],
            [/\b(true|false|none|True|False|None|Ellipsis)\b/, "keyword"],
            [/\b\d+(\.\d+)?([eE][+-]?\d+)?\b/, "number"],
            [/[+\-*/%&|^~<>!=]=?|\.\.\.?|->|=>|:=|\?\?|\?\./, "operator"],
            [/[{}()[\]]/, "@brackets"],
            [/[A-Z][a-zA-Z_]\w*/, "type.identifier"],
            [/[a-zA-Z_]\w*(?=\s*\()/, "function.identifier"],
            [/[a-zA-Z_]\w*/, "identifier"],
          ],
          tqstring: [
            [/"""/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/[^\\"]+/, "string"], [/./, "string"],
          ],
          tqstring2: [
            [/'''/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/[^\\']+/, "string"], [/./, "string"],
          ],
          dqstring: [
            [/"/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/\\[\\'"nrtbfv]/, "string.escape"],
            [/{/, { token: "string.interpolated", next: "@interp" }],
            [/[^\\"{]+/, "string"], [/./, "string"],
          ],
          sqstring: [
            [/'/, { token: "string.quote", bracket: "@close", next: "@pop" }],
            [/\\[\\'"nrtbfv]/, "string.escape"],
            [/{/, { token: "string.interpolated", next: "@interp" }],
            [/[^\\'{]+/, "string"], [/./, "string"],
          ],
          interp: [
            [/}/, { token: "string.interpolated", next: "@pop" }],
            [/[a-zA-Z_]\w*/, "identifier"],
            [/[^}]+/, "string"],
          ],
        },
      });
      monaco.languages.setLanguageConfiguration("nomi", {
        comments: { lineComment: "#" },
        brackets: [["{","}"],["[","]"],["(",")"]],
        autoClosingPairs: [{ open:"{",close:"}" },{ open:"[",close:"]" },{ open:"(",close:")" },{ open:'"',close:'"' },{ open:"'",close:"'" }],
        surroundingPairs: [["{","}"],["[","]"],["(",")"],['"','"'],["'","'"]],
        folding: { offSide: true },
        indentationRules: { increaseIndentPattern: /^.*:\s*$/, decreaseIndentPattern: /^\s*(elif|else|except|finally|case)\b/ },
      });
      monaco.editor.defineTheme("nomi-dark", {
        base: "vs-dark", inherit: true,
        rules: [
          { token: "comment", foreground: "7f8a83", fontStyle: "italic" },
          { token: "keyword", foreground: "d6a36f" },
          { token: "string", foreground: "a7d67a" },
          { token: "string.escape", foreground: "e8c16f" },
          { token: "string.interpolated", foreground: "e8c16f", fontStyle: "bold" },
          { token: "number", foreground: "f0b07a" },
          { token: "operator", foreground: "77d0c2" },
          { token: "tag", foreground: "ef8f8f" },
          { token: "type.identifier", foreground: "9bbdf2" },
          { token: "function.identifier", foreground: "eef3ef" },
          { token: "identifier", foreground: "dce5df" },
          { token: "", foreground: "eef3ef" },
        ],
        colors: {
          "editor.background": "#181c1a", "editor.foreground": "#eef3ef",
          "editor.lineHighlightBackground": "#202621", "editor.selectionBackground": "#405146",
          "editor.inactiveSelectionBackground": "#2d3530", "editorCursor.foreground": "#a7d67a",
          "editorLineNumber.foreground": "#657168", "editorLineNumber.activeForeground": "#c8d2cc",
          "editorIndentGuide.background1": "#2d3530", "editorIndentGuide.activeBackground1": "#526259",
          "editorGutter.background": "#181c1a", "editorWidget.background": "#1f2321", "editorWidget.border": "#3c443f",
        },
      });
      resolve();
    });
  });
}

init().then(() => {
  setupResize(byId("resize-l"), byId("sidebar"));
  addEventListener("resize", () => _cellEditors.forEach(ed => ed && ed.layout()));
});
</script>
